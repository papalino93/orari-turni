<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- coppa del bicchiere = quadrante dell'orologio -->
  <circle cx="32" cy="23" r="15" fill="#fff8f5" stroke="#8a2740" stroke-width="2.5" />

  <!-- indici delle ore -->
  <line x1="32" y1="10" x2="32" y2="12.5" stroke="#8a2740" stroke-width="1.6" stroke-linecap="round" />
  <line x1="32" y1="33.5" x2="32" y2="36" stroke="#8a2740" stroke-width="1.6" stroke-linecap="round" />
  <line x1="19" y1="23" x2="21.5" y2="23" stroke="#8a2740" stroke-width="1.6" stroke-linecap="round" />
  <line x1="42.5" y1="23" x2="45" y2="23" stroke="#8a2740" stroke-width="1.6" stroke-linecap="round" />

  <!-- lancette -->
  <line x1="32" y1="23" x2="32" y2="15" stroke="#8a2740" stroke-width="2.2" stroke-linecap="round" />
  <line x1="32" y1="23" x2="38.5" y2="18.5" stroke="#8a2740" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="32" cy="23" r="1.6" fill="#8a2740" />

  <!-- gambo e base del bicchiere -->
  <path d="M23 33 Q32 44 41 33" fill="none" stroke="#8a2740" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="42" x2="32" y2="53" stroke="#8a2740" stroke-width="2.5" stroke-linecap="round" />
  <line x1="23" y1="56" x2="41" y2="56" stroke="#8a2740" stroke-width="2.5" stroke-linecap="round" />
</svg>
